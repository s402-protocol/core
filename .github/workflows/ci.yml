name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build-typescript:
    name: TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  consumers:
    # The workspace packages that consume `s402` and the README's own front
    # door. A wire major left every one of them broken on the branch that
    # shipped it, and CI said nothing: it ran `typescript/` and `python/` only.
    name: Workspace Consumers + Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # `s402` resolves to `typescript/` via `workspace:*`, and its types are
      # `dist/index.d.mts`. Nothing else in this job builds them, so without
      # this step every consumer fails with "Cannot find module 's402'" — which
      # is what happened on the first run of this job.
      - name: Build s402 so the consumers can resolve its types
        run: pnpm --filter s402 build

      - name: Typecheck server-ts
        run: pnpm --filter @sweefi/server exec tsc --noEmit

      - name: Typecheck demo-api
        run: pnpm --filter s402-demo-api exec tsc --noEmit

      - name: Typecheck mcp-demo
        run: pnpm --filter s402-mcp-demo exec tsc --noEmit

      - name: Run the README quickstart demo
        run: pnpm demo

  boundary-check:
    name: S7 Chain-Agnostic Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep for chain-specific patterns in s402 src/
        run: |
          VIOLATIONS=0
          # Strip comments: // line comments, /* block openers, and JSDoc * continuation lines.
          # NOTE: grep -rn output is "file:line:content", so the patterns must anchor
          # AFTER the file:line: prefix — the previous ^-anchored patterns could never
          # match and the stripper was dead code (caught 2026-07-18, v0.8.0 CI failure).
          STRIP_COMMENTS='grep -v ":[0-9]*:\s*//" | grep -v ":[0-9]*:\s*\*" | grep -v ":[0-9]*:\s*/\*"'

          # Sui SDK imports
          if grep -rn '@mysten/sui' typescript/src/ --include='*.ts' | eval "$STRIP_COMMENTS"; then
            echo "::error::Found @mysten/sui imports in s402 src/ — these belong in @sweefi/sui"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Sui coin type literal
          if grep -rn '0x2::sui::SUI' typescript/src/ --include='*.ts' | eval "$STRIP_COMMENTS"; then
            echo "::error::Found Sui coin type literal in s402 src/"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Solana SDK imports
          if grep -rn '@solana/web3' typescript/src/ --include='*.ts' | eval "$STRIP_COMMENTS"; then
            echo "::error::Found @solana/web3 imports in s402 src/"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Ethers.js imports
          if grep -rn "from ['\"]ethers['\"]" typescript/src/ --include='*.ts' | eval "$STRIP_COMMENTS"; then
            echo "::error::Found ethers imports in s402 src/"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Viem imports
          if grep -rn "from ['\"]viem['\"]" typescript/src/ --include='*.ts' | eval "$STRIP_COMMENTS"; then
            echo "::error::Found viem imports in s402 src/"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::$VIOLATIONS chain-specific pattern(s) found in s402 src/. See ADR-002 and INVARIANTS.md S7."
            exit 1
          fi

          echo "✓ No chain-specific patterns found in s402 src/"

  test-python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"
      - run: pytest -v
