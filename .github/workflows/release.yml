name: Release

# Tag conventions (split 2026-07-18 after the v0.8.0 release failure):
#   v*     → npm (TypeScript package)
#   py-v*  → PyPI (Python package) — decoupled until the Python port reaches
#            version parity (v0.8.0 tag hit "pyproject.toml is 0.1.0" and failed).
on:
  push:
    tags:
      - 'v*'
      - 'py-v*'

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing

jobs:
  publish-npm:
    name: Publish to npm
    if: ${{ !startsWith(github.ref_name, 'py-v') }}
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Verify the tag version matches package.json
      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # Idempotency guard: the interactive 2FA ritual publishes manually; on
      # 2026-07-18 that beat this job by 5 seconds and the duplicate publish
      # failed the workflow. If the version is already live, succeed quietly.
      - name: Skip if already published
        id: pubcheck
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "s402@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "s402@${PKG_VERSION} already on the registry — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm publish --no-git-checks
        if: steps.pubcheck.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref_name, 'py-v') }}
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      # Verify the tag version matches pyproject.toml
      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          PKG_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi

      # Run conformance tests before publishing
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -v

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
